<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Compiler Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div>
                <h2>Smart Compiler</h2>
                <p>Mini Language IDE</p>
            </div>
        </div>

        <div class="side-section">
            <h3>Language Supports</h3>
            <div class="tag">let</div>
            <div class="tag">print()</div>
            <div class="tag">if else</div>
            <div class="tag">while</div>
            <div class="tag">+ * / &lt; &gt;</div>
        </div>
    </aside>

    <main class="main-area">

        <header class="topbar">
            <div>
                <h1>Compiler Playground</h1>
                <p>Write code, run analysis, view AST, symbols and output.</p>
            </div>

            <div class="toolbar">
                <button class="btn primary" onclick="runCode()">▶ Run Code</button>
                <button class="btn" onclick="loadSample()">Load Sample</button>
                <button class="btn danger" onclick="clearAll()">Clear</button>
            </div>
        </header>

        <section class="dashboard">
            <div class="stat-card">
                <span>Errors</span>
                <strong id="errorCount">0</strong>
            </div>
            <div class="stat-card">
                <span>Warnings</span>
                <strong id="warningCount">0</strong>
            </div>
            <div class="stat-card">
                <span>Output Lines</span>
                <strong id="outputCount">0</strong>
            </div>
            <div class="stat-card">
                <span>Status</span>
                <strong id="statusText">Ready</strong>
            </div>
        </section>

        <section class="workspace">

            <div class="editor-panel">
                <div class="panel-header">
                    <span class="live-dot">● Live Analyze</span>
                </div>

                <div class="editor-wrap">
                    <div class="line-numbers" id="lineNumbers">1</div>
                    <textarea id="code" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="result-panel">
                <div class="tabs">
                    <button class="tab active" onclick="openTab('errors')">Errors</button>
                    <button class="tab" onclick="openTab('warnings')">Warnings</button>
                    <button class="tab" onclick="openTab('output')">Output</button>
                    <button class="tab" onclick="openTab('ast')">AST Tree</button>
                    <button class="tab" onclick="openTab('symbols')">Symbols</button>
                </div>

                <div class="tab-content active" id="errors"></div>
                <div class="tab-content" id="warnings"></div>
                <div class="tab-content" id="output"></div>

                <div class="tab-content" id="ast">
                    <svg id="astSvg"></svg>
                </div>

                <div class="tab-content" id="symbols">
                    <div class="symbol-card">
                        <h2>Symbol Table</h2>
                        <table class="symbol-table">
                            <thead>
                                <tr>
                                    <th>Variable</th>
                                    <th>Value</th>
                                    <th>Type</th>
                                </tr>
                            </thead>
                            <tbody id="symbolTableBody"></tbody>
                        </table>
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>
</body>
</html>
