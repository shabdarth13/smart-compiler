<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Compiler IDE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>⚡ Smart Compiler IDE</h1>
        <div class="toolbar">
            <button onclick="runCode()">▶ Run</button>
            <button onclick="clearAll()">🧹 Clear</button>
            <button onclick="loadSample()">📄 Sample Code</button>
        </div>
    </header>

    <div class="main">

        <div class="editor-section">
            <div class="editor-header">Editor</div>
            <textarea id="code" spellcheck="false"></textarea>
        </div>

        <div class="output-section">

            <div class="tabs">
                <button class="tab active" onclick="openTab('errors')">Errors</button>
                <button class="tab" onclick="openTab('warnings')">Warnings</button>
                <button class="tab" onclick="openTab('output')">Output</button>
                <button class="tab" onclick="openTab('ast')">AST</button>
                <button class="tab" onclick="openTab('symbols')">Symbols</button>
            </div>

            <div class="tab-content active" id="errors"></div>
            <div class="tab-content" id="warnings"></div>
            <div class="tab-content" id="output"></div>

            <div class="tab-content" id="ast">
                <svg id="astSvg"></svg>
            </div>

            <div class="tab-content" id="symbols">
                <div class="symbol-card">
                    <h2>Symbol Table</h2>

                    <table class="symbol-table">
                        <thead>
                            <tr>
                                <th>Variable</th>
                                <th>Value</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody id="symbolTableBody"></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
